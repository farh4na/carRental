
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'register.css' %}">
  <title>Registration Page</title>
</head>
<body>
<div class="Header">
    <div class="Navbar">
        <div class="Logo">
            <div class="Smartrental"><span class="Smart">SMART</span><span class="Rental">RENTAL</span></div>
        </div>
        <div class="NavRight">
            <div class="Right">
                <a href="{% url 'login' %}" class="NavLink">Login</a>
                <a href="{% url 'register' %}" class="Register">Register</a>
            </div>
        </div>
    </div>
    
    <div class="Billboard">
        <div class="BgOuter">
            <div class="BgInner"></div>
            <div class="PatternRight">
                <div class="Polygon2"></div>
            </div>
            <div class="IconText">
                <div class="UserRegistration">user registration</div>
            <form method="post" action="{% url 'register' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="InputFieldWithLabel">
                    <label class="Label" for="username">Username</label>
                    <input class="Field" type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="InputFieldWithLabel">
                    <label class="Label" for="email">Email Address</label>
                    <input class="Field" type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="InputFieldWithLabel">
                    <label class="Label" for="password">Password</label>
                    <input class="Field" type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="InputFieldWithLabel">
                    <label class="Label" for="confirm_password">Re-type Password</label>
                    <input class="Field" type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
                </div>
                <div class="InputFieldWithLabel">
                    <label class="Label" for="phone_number">Phone Number</label>
                    <input class="Field" type="text" id="phone_number" name="phone_number" placeholder="Enter your phone number" required>
                </div>
                <div class="InputFieldWithLabel">
                    <label class="Label" for="address">Address</label>
                    <input class="Field" type="text" id="address" name="address" placeholder="Enter your address" required>
                </div>
                
                <div class="Button">
                    <button class="RegisterBtn" type="submit">REGISTER</button>
                </div>
            </form>
                
        </div>
    </div>
</div>
{% if messages %}
    <div class="error-message">
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    </div>
{% endif %}
</body>
</html>
